<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NeneTH — Revoke Mint Authority</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0d0f14;color:white;margin:0;padding:28px}
.card{max-width:760px;margin:auto;background:#171a22;border:1px solid #333;border-radius:18px;padding:24px}
h1{margin-top:0}.muted{color:#aeb4c0}.ok{color:#73e2a7}.bad{color:#ff8585}
code{word-break:break-all;background:#0b0d12;padding:3px 6px;border-radius:6px}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
#connect{background:#ab8cff}.danger{background:#ff5d73;color:white}.danger:disabled{opacity:.35;cursor:not-allowed}
.box{background:#0f1218;border:1px solid #2b303b;border-radius:12px;padding:14px;margin:14px 0}
</style>
</head>
<body>
<div class="card">
<h1>👑 NeneTH — Revoke Mint Authority</h1>
<p class="muted">Solana Mainnet • Official public RPC • No service fee • Phantom signs the SPL Token transaction.</p>
<div class="box">
<b>Token</b><br>Nene Royal Fans (NeneTH)<br><br>
<b>Mint</b><br><code id="mintText"></code><br><br>
<b>Required current authority</b><br><code id="authorityText"></code>
</div>
<button id="connect">Connect Phantom</button>
<div id="status" class="box muted">Not connected.</div>
<button id="revoke" class="danger" disabled>REVOKE MINT AUTHORITY — PERMANENT</button>
<p class="muted">This page never requests your seed phrase or private key. Revoke is irreversible.</p>
</div>

<script type="module">
import { Connection, PublicKey, Transaction } from "https://esm.sh/@solana/web3.js@1.98.4";
import { AuthorityType, TOKEN_PROGRAM_ID, createSetAuthorityInstruction, getMint } from "https://esm.sh/@solana/spl-token@0.4.14";

const MINT = new PublicKey("F5SaYu1BjHxcnjgPsRqEVZhmAmkiz7DP2nQ5aKvRgTt5");
const EXPECTED_AUTHORITY = new PublicKey("Gc8zrvYcrrgeDaGH2svBAtL3VByR6GW34ghg1H4i35gA");
const connection = new Connection("https://api.mainnet.solana.com", "confirmed");

document.querySelector("#mintText").textContent = MINT.toBase58();
document.querySelector("#authorityText").textContent = EXPECTED_AUTHORITY.toBase58();

const status = document.querySelector("#status");
const revokeBtn = document.querySelector("#revoke");
let provider;

function setStatus(msg, cls="muted"){
  status.className = "box " + cls;
  status.textContent = msg;
}

async function inspect(){
  const mintInfo = await getMint(connection, MINT, "confirmed", TOKEN_PROGRAM_ID);

  if (mintInfo.mintAuthority === null){
    setStatus("Mint Authority is already NONE. Nothing to revoke.", "ok");
    revokeBtn.disabled = true;
    return;
  }

  const current = mintInfo.mintAuthority.toBase58();

  if (current !== EXPECTED_AUTHORITY.toBase58()){
    setStatus("STOP: On-chain Mint Authority does not match expected wallet. Found: " + current, "bad");
    revokeBtn.disabled = true;
    return;
  }

  if (!provider?.publicKey || provider.publicKey.toBase58() !== current){
    setStatus("Connected wallet is not the current Mint Authority. Connect Founder wallet " + current, "bad");
    revokeBtn.disabled = true;
    return;
  }

  setStatus(
    "Verified on Mainnet ✅ Supply: " +
    (Number(mintInfo.supply) / 1e9).toLocaleString() +
    " NeneTH | Decimals: " + mintInfo.decimals +
    " | Mint Authority: " + current,
    "ok"
  );
  revokeBtn.disabled = false;
}

document.querySelector("#connect").onclick = async () => {
  try{
    provider = window.phantom?.solana;
    if (!provider?.isPhantom) throw new Error("Phantom extension not found.");
    await provider.connect();
    await inspect();
  }catch(e){
    setStatus("Error: " + (e?.message || e), "bad");
  }
};

revokeBtn.onclick = async () => {
  try{
    revokeBtn.disabled = true;

    // Re-check live state before constructing the irreversible instruction.
    const mintInfo = await getMint(connection, MINT, "confirmed", TOKEN_PROGRAM_ID);
    if (
      mintInfo.mintAuthority === null ||
      mintInfo.mintAuthority.toBase58() !== EXPECTED_AUTHORITY.toBase58() ||
      provider.publicKey.toBase58() !== EXPECTED_AUTHORITY.toBase58()
    ){
      throw new Error("Authority verification failed. No transaction created.");
    }

    const ix = createSetAuthorityInstruction(
      MINT,
      EXPECTED_AUTHORITY,
      AuthorityType.MintTokens,
      null,
      [],
      TOKEN_PROGRAM_ID
    );

    const latest = await connection.getLatestBlockhash("confirmed");
    const tx = new Transaction({
      feePayer: provider.publicKey,
      blockhash: latest.blockhash,
      lastValidBlockHeight: latest.lastValidBlockHeight
    }).add(ix);

    const result = await provider.signAndSendTransaction(tx);
    setStatus("Submitted: " + result.signature + " — waiting for confirmation...", "muted");

    await connection.confirmTransaction({
      signature: result.signature,
      blockhash: latest.blockhash,
      lastValidBlockHeight: latest.lastValidBlockHeight
    }, "confirmed");

    const after = await getMint(connection, MINT, "confirmed", TOKEN_PROGRAM_ID);
    if (after.mintAuthority === null){
      setStatus("SUCCESS ✅ Mint Authority = NONE. Signature: " + result.signature, "ok");
    }else{
      setStatus("Transaction confirmed but Mint Authority is not NONE. Check Explorer before doing anything else.", "bad");
    }
  }catch(e){
    setStatus("Stopped/Error: " + (e?.message || e), "bad");
    try{ await inspect(); }catch{}
  }
};
</script>
</body>
</html>
